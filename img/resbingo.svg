<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  <!-- Bingo grid (3x3 simplified) -->
  <g fill="white" fill-opacity="0.9">
    <rect x="15" y="15" width="18" height="18" rx="3"/>
    <rect x="41" y="15" width="18" height="18" rx="3"/>
    <rect x="67" y="15" width="18" height="18" rx="3"/>
    <rect x="15" y="41" width="18" height="18" rx="3"/>
    <rect x="41" y="41" width="18" height="18" rx="3"/>
    <rect x="67" y="41" width="18" height="18" rx="3"/>
    <rect x="15" y="67" width="18" height="18" rx="3"/>
    <rect x="41" y="67" width="18" height="18" rx="3"/>
    <rect x="67" y="67" width="18" height="18" rx="3"/>
  </g>
  <!-- Checkmark on center cell -->
  <path d="M46 50 L49 53 L56 46" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
